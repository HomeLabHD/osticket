# Rootless nginx for osTicket. Runs as the container user (no `user` directive — an
# unprivileged master can't setuid). pid/temp under /run/osticket (writable, chowned at
# build). Logs to stdout/stderr (Loki-friendly). Listen port is templated from
# $HTTP_PORT by the entrypoint (the __HTTP_PORT__ marker). stub_status on 127.0.0.1 for
# a metrics-exporter sidecar (VictoriaMetrics).
#
# URL routing follows osTicket's canonical nginx recipe: PATH_INFO is captured from the
# request URI into $path_info and passed to PHP explicitly (osTicket's Dispatcher reads
# $_SERVER['PATH_INFO']). /api/* dispatches through api/http.php; scp + client AJAX
# endpoints also carry PATH_INFO. This is what makes the API + SSO/OAuth2 callbacks work.
worker_processes auto;
pid /run/osticket/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # All temp paths under the writable runtime dir (rootless).
    client_body_temp_path /run/osticket/nginx/client_body;
    proxy_temp_path       /run/osticket/nginx/proxy;
    fastcgi_temp_path     /run/osticket/nginx/fastcgi;
    uwsgi_temp_path       /run/osticket/nginx/uwsgi;
    scgi_temp_path        /run/osticket/nginx/scgi;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25m;   # aligned with PHP_UPLOAD_MAX_SIZE; entrypoint retunes

    server {
        listen __HTTP_PORT__;
        server_name _;
        root /var/www/html;
        index index.php;
        server_tokens off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        charset utf-8;
        set $path_info "";

        # nginx status for a prometheus exporter sidecar → VictoriaMetrics. Internal only.
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Hard-deny the (renamed) installer dir, app internals, and any .ht* file.
        location ^~ /setup_hidden { deny all; return 403; }
        location ~ /include { deny all; return 403; }
        location ~ /\.ht { deny all; }

        # osTicket API — capture PATH_INFO (the path after /api) and dispatch via http.php.
        # e.g. /api/auth/oauth2 → PATH_INFO=/auth/oauth2 (the SSO/OAuth2 callback route).
        if ($request_uri ~ "^/api(/[^\?]+)") { set $path_info $1; }
        location /api { try_files $uri $uri/ /api/http.php?$query_string; }

        # scp + client AJAX endpoints carry PATH_INFO too.
        if ($request_uri ~ "^/scp/.*\.php(/[^\?]+)") { set $path_info $1; }
        location ~ ^/scp/ajax\.php/.*$ { try_files $uri $uri/ /scp/ajax.php?$query_string; }
        if ($request_uri ~ "^/ajax\.php(/[^\?]+)") { set $path_info $1; }
        location ~ ^/ajax\.php/.*$ { try_files $uri $uri/ /ajax.php?$query_string; }

        # Front controller: client portal + scp pretty-URLs.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { log_not_found off; access_log off; }
        location = /robots.txt  { log_not_found off; access_log off; }

        # PHP → php-fpm. PATH_INFO comes from the $path_info captured above (osTicket reads it).
        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO       $path_info;
        }
    }
}
