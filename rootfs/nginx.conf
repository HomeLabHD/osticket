# Rootless nginx for osTicket. Runs as the container user (no `user` directive — an
# unprivileged master can't setuid). pid/temp under /run/osticket (writable, chowned at
# build). Logs to stdout/stderr (Loki-friendly). Listen port is templated from
# $HTTP_PORT by the entrypoint (the __HTTP_PORT__ marker). stub_status on 127.0.0.1 for
# a metrics-exporter sidecar (VictoriaMetrics).
worker_processes auto;
pid /run/osticket/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # All temp paths under the writable runtime dir (rootless).
    client_body_temp_path /run/osticket/nginx/client_body;
    proxy_temp_path       /run/osticket/nginx/proxy;
    fastcgi_temp_path     /run/osticket/nginx/fastcgi;
    uwsgi_temp_path       /run/osticket/nginx/uwsgi;
    scgi_temp_path        /run/osticket/nginx/scgi;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25m;   # aligned with PHP_UPLOAD_MAX_SIZE; entrypoint retunes

    server {
        listen __HTTP_PORT__;
        server_name _;
        root /var/www/html;
        index index.php;

        # nginx status for a prometheus exporter sidecar → VictoriaMetrics. Internal only.
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Hard-deny the (renamed) installer dir. `^~` makes this prefix match win over
        # the `\.php$` regex location below, so nothing under setup_hidden is ever
        # executed or served — it exists only for the boot-time install-seed.php.
        location ^~ /setup_hidden { deny all; return 403; }

        # osTicket front-controller routing.
        location / {
            try_files $uri $uri/ /scp/$1 index.php?$query_string;
        }

        location ~ ^/api/(?:tickets|tasks)(?:\.(?:json|xml|email))?$ {
            try_files $uri $uri/ /api/http.php?$query_string;
        }

        location ~ ^/scp/.*\.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Deny the usual osTicket sensitive paths.
        location ~ /(include|setup) { deny all; return 403; }
    }
}
