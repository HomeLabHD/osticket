# Rootless nginx for osTicket. Runs as the container user (no `user` directive — an
# unprivileged master can't setuid). pid/temp under /run/osticket (writable, chowned at
# build). Logs to stdout/stderr (Loki-friendly). Listen port is templated from
# $HTTP_PORT by the entrypoint (the __HTTP_PORT__ marker). stub_status on 127.0.0.1 for
# a metrics-exporter sidecar (VictoriaMetrics).
worker_processes auto;
pid /run/osticket/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # All temp paths under the writable runtime dir (rootless).
    client_body_temp_path /run/osticket/nginx/client_body;
    proxy_temp_path       /run/osticket/nginx/proxy;
    fastcgi_temp_path     /run/osticket/nginx/fastcgi;
    uwsgi_temp_path       /run/osticket/nginx/uwsgi;
    scgi_temp_path        /run/osticket/nginx/scgi;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25m;   # aligned with PHP_UPLOAD_MAX_SIZE; entrypoint retunes

    server {
        listen __HTTP_PORT__;
        server_name _;
        root /var/www/html;
        index index.php;

        # nginx status for a prometheus exporter sidecar → VictoriaMetrics. Internal only.
        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Hard-deny the (renamed) installer dir + app internals. `^~` wins over the .php
        # regex below, so nothing under these is ever executed or served (setup_hidden
        # exists only for boot-time install-seed.php; include holds app internals).
        location ^~ /setup_hidden { deny all; return 403; }
        location ^~ /include/     { deny all; return 403; }

        # osTicket API — mirrors api/.htaccess: any /api/<path> that is NOT a real file is
        # dispatched through api/http.php with the trailing path as PATH_INFO. This is what
        # makes SSO/OAuth2 callbacks work, e.g. /api/auth/oauth2 → /api/http.php/auth/oauth2.
        # Real .php files under /api (http.php, cron.php, pipe.php) match the PHP regex below
        # and run directly. Plain prefix (NOT ^~) so the PHP regex still wins for *.php.
        location /api/ {
            try_files $uri @osticket_api;
        }
        location @osticket_api {
            rewrite ^/api/(.*)$ /api/http.php/$1 last;
        }

        # Front controller: unmatched paths (client portal, scp pretty-URLs) → index.php.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # All PHP, with PATH_INFO support (scp/index.php/..., api/http.php/auth/oauth2).
        location ~ [^/]\.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            try_files $fastcgi_script_name =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO       $fastcgi_path_info;
        }
    }
}
