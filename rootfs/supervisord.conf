; Rootless process manager: nginx + php-fpm + osTicket cron, all unprivileged, all
; logging to the container's stdout/stderr (→ Loki via the k8s log pipeline).
[supervisord]
nodaemon=true
user=
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/osticket/supervisord.pid

[program:php-fpm]
command=php-fpm -F
priority=10
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /run/osticket/nginx.conf -g "daemon off;"
priority=20
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; osTicket cron — runs api/cron.php every CRON_INTERVAL minutes (env set in the image).
[program:cron]
command=sh -c "while true; do php /var/www/html/api/cron.php >/dev/null 2>&1 || true; sleep $(( %(ENV_CRON_INTERVAL)s * 60 )); done"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
