; Rootless php-fpm pool for osTicket. The default www.conf is removed in the Dockerfile,
; so this is the only pool. No user/group directives — the master already runs as the
; container uid (uid 1000 by default, or whatever runAsUser is set to) and cannot setuid.
[global]
error_log = /dev/stderr
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Status page for a php-fpm-exporter sidecar → VictoriaMetrics (scraped on :9000 directly).
pm.status_path = /php-fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
